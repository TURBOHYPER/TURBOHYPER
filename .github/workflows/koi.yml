name: Git Koi
on:
  workflow_dispatch:
  schedule:
    - cron: '12 0 * * *'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: TURBOHYPER
          body: asagi
          size: 768x256
          scale: 1
          output-dir: koi
      - name: Commit generated koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh git koi"
            git push
          fi
